version: "3.8"

services:
  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=normaldance
      - POSTGRES_USER=normaldance
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - normaldance
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normaldance -d normaldance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚡ Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - normaldance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  normaldance:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
