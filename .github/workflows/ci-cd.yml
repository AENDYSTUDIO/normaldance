name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --passWithNoTests
      - name: Integration tests
        run: npm run test:integration -- --passWithNoTests
      - name: Coverage
        run: npm run test:coverage

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Security audit and container scan
        run: npm run security:scan
        continue-on-error: true

  docs_and_analysis:
    name: Docs and Analysis
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate API docs
        run: npm run docs:api
      - name: Bundle analysis (build only)
        run: npm run analyze:bundle
        env:
          ANALYZE: true
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
      - name: Extract i18n strings
        run: npm run i18n:extract

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [tests, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quick-checks, tests, security, docs_and_analysis, build]
    if: success()
    steps:
      - run: echo "✅ All checks passed successfully!"
